<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">SaaS Dental, software para clínicas odontológicas</title>
  <desc id="description">Todo lo que tu clínica dental necesita, en un solo lugar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1080" cy="90" r="190" fill="#ccfbf1" opacity="0.55"/>
  <rect x="72" y="70" width="54" height="54" rx="16" fill="#0d9488"/>
  <text x="99" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">D</text>
  <text x="145" y="109" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f766e">SaaS Dental</text>
  <text x="72" y="235" font-family="Arial, sans-serif" font-size="65" font-weight="700" fill="#0f172a">
    <tspan x="72" dy="0">Todo lo que tu clínica dental</tspan>
    <tspan x="72" dy="76">necesita, en un solo lugar.</tspan>
  </text>
  <text x="72" y="440" font-family="Arial, sans-serif" font-size="27" fill="#475569">
    <tspan x="72" dy="0">Citas, pacientes, historias clínicas, tratamientos y pagos</tspan>
    <tspan x="72" dy="42">desde una plataforma diseñada para Bolivia.</tspan>
  </text>
  <rect x="72" y="544" width="272" height="4" rx="2" fill="#14b8a6"/>
</svg>
